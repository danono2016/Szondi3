name: P0 canonical access

on:
  pull_request:
    branches: [main, work/ai-clinical-provenance-strategy-001]
  push:
    branches: [main, work/ai-clinical-provenance-strategy-001]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-access:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable evidence and foundation
        run: python scripts/verify_foundation.py

      - name: Run spec-derived canonical access tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Generate canonical access run A
        run: python scripts/canonical_access.py --output-dir artifacts/canonical-a

      - name: Generate canonical access run B
        run: python scripts/canonical_access.py --output-dir artifacts/canonical-b

      - name: Verify byte-identical deterministic regeneration
        run: diff -ru artifacts/canonical-a artifacts/canonical-b

      - name: Validate canonical inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/canonical-a')
          manifest = json.loads((root / 'canonical-hashes.json').read_text(encoding='utf-8'))
          sources = manifest.get('sources', {})
          if len(sources) != 10:
              raise SystemExit(f'Expected 10 canonical source entries, got {len(sources)}')
          for source_id, files in sorted(sources.items()):
              expected = {f'{source_id}.jsonl', f'{source_id}.inventory.json'}
              if set(files) != expected:
                  raise SystemExit(f'Unexpected canonical files for {source_id}: {sorted(files)}')
              for name in expected:
                  if not (root / name).is_file():
                      raise SystemExit(f'Missing generated file: {name}')
          print('P0 CANONICAL INVENTORY: PASS')
          PY

      - name: Verify recorded derivative identity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          recorded = json.loads(Path('verification/P0_CANONICAL_DERIVATIVE_MANIFEST.json').read_text(encoding='utf-8'))
          generated_path = Path('artifacts/canonical-a/canonical-hashes.json')
          generated_bytes = generated_path.read_bytes()
          generated = json.loads(generated_bytes)
          catalog = json.loads(Path('config/source_catalog.json').read_text(encoding='utf-8'))

          expected_inputs = {
              source['sourceId']: {
                  'docxPath': source['docxPath'],
                  'docxSha256': source['docxSha256'],
              }
              for source in catalog['sources']
          }

          if recorded['status'] != 'DERIVATIVE_IDENTITY_ONLY_NOT_SOURCE_AUTHORITY':
              raise SystemExit('Canonical derivative manifest authority status changed')
          if recorded['inputs'] != expected_inputs:
              raise SystemExit('Canonical derivative manifest input identities do not match source catalog')
          if recorded['canonicalHashes'] != generated:
              raise SystemExit('Canonical derivative manifest does not match regenerated output')
          actual_manifest_sha = hashlib.sha256(generated_bytes).hexdigest()
          if recorded['canonicalContentManifestSha256'] != actual_manifest_sha:
              raise SystemExit('Canonical content manifest SHA-256 mismatch')
          print('P0 CANONICAL DERIVATIVE IDENTITY: PASS')
          PY

      - name: Independently verify source structure and provenance
        run: python scripts/verify_canonical_access.py --output-dir artifacts/canonical-a

      - name: Validate visual-arbitration source set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path('config/source_catalog.json').read_text(encoding='utf-8'))
          lock = json.loads(Path('config/evidence_lock.json').read_text(encoding='utf-8'))
          pdfs = [source['pdfPath'] for source in catalog['sources'] if source.get('pdfPath')]
          if len(pdfs) != 10 or len(set(pdfs)) != 10:
              raise SystemExit(f'Expected exactly 10 unique admitted PDF paths, got {len(set(pdfs))}')
          locked = set(lock['pdfGitBlobs'])
          if set(pdfs) != locked:
              raise SystemExit('Source catalog PDF set differs from evidence lock')
          missing = [path for path in pdfs if not Path(path).is_file()]
          if missing:
              raise SystemExit(f'Missing admitted PDF files: {missing}')
          print('P0 VISUAL ARBITRATION SOURCE SET: PASS')
          PY

      - name: Upload independent canonical access artifact
        uses: actions/upload-artifact@v4
        with:
          name: p0-canonical-access
          path: artifacts/canonical-a
          if-no-files-found: error
          retention-days: 90

      - name: Upload admitted visual-arbitration sources
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: p0-visual-arbitration-sources
          path: sources/originals/*.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Upload admitted canonical-source DOCX
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: p0-canonical-source-docx
          path: sources/text/*.docx
          if-no-files-found: error
          retention-days: 90
