name: P0 source inspection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-docx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Inspect admitted DOCX structure
        run: python scripts/inspect_docx_sources.py --output artifacts/p0-docx-inspection.json

      - name: Upload structural inspection
        uses: actions/upload-artifact@v4
        with:
          name: p0-docx-inspection
          path: artifacts/p0-docx-inspection.json
          if-no-files-found: error
          retention-days: 14
