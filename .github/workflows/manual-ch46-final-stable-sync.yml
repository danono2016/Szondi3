name: Manual CH46 final stable sync

on:
  push:
    branches:
      - manual-ch46-final-stable

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize CH46 final stable status
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          FINAL = "STABLE DRAFT / DOCTRINAL PASS / SCIENTIFIC AUDIT CLOSED / STYLE PASS / READER PASS CLOSED / CH46-DIAG-01 SOURCE/DOCTRINAL TENSION HOLD ACTIVE"
          chapter_path = Path("docs/manual/chapters/46_Sindromul_experimental_de_la_constelatie_la_ipoteza_clinica_DRAFT.md")
          reader_path = Path("docs/manual/reviews/CH46_READER_PASS.md")
          state_path = Path("docs/manual/CURRENT_STATE.md")

          # 1) CH46 frontmatter
          s = chapter_path.read_text(encoding="utf-8")
          s, n = re.subn(r"^\*\*Statut:\*\*.*$", f"**Statut:** {FINAL}  ", s, count=1, flags=re.M)
          assert n == 1
          s, n = re.subn(
              r"^\*\*Notă editorială:\*\*.*$",
              "**Notă editorială:** Verdictul final al ultimului auditor închide integral gate-urile de conținut: **DOCTRINAL PASS / SCIENTIFIC AUDIT CLOSED / STYLE PASS / READER PASS CLOSED**. Micro-revizia cerută la recheck-ul anterior a fost integrată corect. `CH46-DIAG-01` rămâne documentat, activ și non-blocking. Capitolul este **STABLE DRAFT**.",
              s, count=1, flags=re.M)
          assert n == 1
          for stale in ["STYLE RECHECK REQUIRED", "fără STYLE PASS", "fără READER PASS CLOSED", "fără STABLE DRAFT"]:
              s = s.replace(stale, "")
          chapter_path.write_text(s, encoding="utf-8")

          # 2) CH46 reader/style review
          s = reader_path.read_text(encoding="utf-8")
          s, n = re.subn(r"^\*\*Statut:\*\*.*$", f"**Statut:** {FINAL}  ", s, count=1, flags=re.M)
          assert n == 1
          marker = "\n---\n"
          final_block = (
              "\n**Verdict final al ultimului auditor:** **STYLE PASS / READER PASS CLOSED / STABLE DRAFT.** "
              "Micro-revizia cerută la recheck-ul precedent a fost integrată corect; nu mai există corecții, completări sau intervenții editoriale necesare. "
              "`CH46-DIAG-01` rămâne documentat și non-blocking.\n"
          )
          if "**Verdict final al ultimului auditor:**" not in s:
              s = s.replace(marker, final_block + marker, 1)
          # close any remaining current-gate markers without rewriting the historical interim verdict
          s = s.replace(" / STYLE RECHECK REQUIRED", "")
          s = s.replace(" / fără STYLE PASS", "")
          s = s.replace(" / fără READER PASS CLOSED", "")
          s = s.replace(" / fără STABLE DRAFT", "")
          s = s.replace("STYLE RECHECK REQUIRED", "STYLE PASS / READER PASS CLOSED / CHAPTER STABLE")
          s = re.sub(
              r"Recheck stilistic extern final al DRAFT v3 după micro-revizie, blob SHA `a2b365c72c375699941dabed10ddc4bbf37049a9`\.?",
              "GATE CLOSED — STYLE PASS / READER PASS CLOSED / CHAPTER STABLE.",
              s)
          reader_path.write_text(s, encoding="utf-8")

          # 3) CURRENT_STATE.md
          s = state_path.read_text(encoding="utf-8")
          old_general = "CHAPTER 46 — DRAFT v3 / DOCTRINAL PASS / SCIENTIFIC AUDIT CLOSED / READER PASS RECEIVED / MODERATE REVISION INTEGRATED / EXTERNAL STYLE RECHECK RECEIVED / PASS WITH MICRO-REVISION / MICRO-REVISION INTEGRATED / STYLE RECHECK NEXT"
          new_general = "CHAPTER 46 — STABLE DRAFT / DOCTRINAL PASS / SCIENTIFIC AUDIT CLOSED / STYLE PASS / READER PASS CLOSED / CH46-DIAG-01 SOURCE/DOCTRINAL TENSION HOLD ACTIVE"
          assert old_general in s
          s = s.replace(old_general, new_general, 1)

          old_heading = "## Capitolul 46 — DRAFT v3 / DOCTRINAL PASS / SCIENTIFIC AUDIT CLOSED / EXTERNAL READER PASS RECEIVED / PASS WITH MODERATE REVISION INTEGRATED / EXTERNAL STYLE RECHECK RECEIVED / PASS WITH MICRO-REVISION / MICRO-REVISION INTEGRATED / STYLE RECHECK REQUIRED / CH46-DIAG-01 SOURCE/DOCTRINAL TENSION HOLD ACTIVE"
          new_heading = "## Capitolul 46 — STABLE DRAFT / DOCTRINAL PASS / SCIENTIFIC AUDIT CLOSED / STYLE PASS / READER PASS CLOSED / CH46-DIAG-01 SOURCE/DOCTRINAL TENSION HOLD ACTIVE"
          assert old_heading in s
          s = s.replace(old_heading, new_heading, 1)

          old_para = "Recheck-ul stilistic extern integral al DRAFT v3, pe blobul `a256fff1b47aff7191358361fbdc0369318d5c88`, a acordat **PASS WITH MICRO-REVISION. Nu încă STYLE PASS.** Cele cinci intervenții locale au fost integrate în blobul `a2b365c72c375699941dabed10ddc4bbf37049a9`, fără redeschiderea auditului doctrinar. `CH46-DIAG-01` rămâne activ și protejat. Capitolul așteaptă recheck-ul stilistic extern final al versiunii micro-revizuite; nu are încă `STYLE PASS`, `READER PASS CLOSED` sau `STABLE DRAFT`."
          new_para = "Recheck-ul stilistic extern integral al DRAFT v3, pe blobul `a256fff1b47aff7191358361fbdc0369318d5c88`, a acordat **PASS WITH MICRO-REVISION**; cele cinci intervenții locale au fost integrate în blobul `a2b365c72c375699941dabed10ddc4bbf37049a9`, fără redeschiderea auditului doctrinar. Verdictul final al ultimului auditor a închis apoi integral gate-ul stilistic: **STYLE PASS / READER PASS CLOSED**. Nu mai există corecții sau intervenții editoriale necesare. `CH46-DIAG-01` rămâne activ, documentat și non-blocking. Capitolul este **STABLE DRAFT**."
          assert old_para in s
          s = s.replace(old_para, new_para, 1)

          s = s.replace(
              "- `chapters/46_Sindromul_experimental_de_la_constelatie_la_ipoteza_clinica_DRAFT.md` — DRAFT v3 / DOCTRINAL PASS / SCIENTIFIC AUDIT CLOSED / READER PASS REVISION INTEGRATED / EXTERNAL STYLE RECHECK RECEIVED / PASS WITH MICRO-REVISION / MICRO-REVISION INTEGRATED / CH46-DIAG-01 ACTIVE / STYLE RECHECK REQUIRED / fără STYLE PASS / fără READER PASS CLOSED / fără STABLE DRAFT;",
              "- `chapters/46_Sindromul_experimental_de_la_constelatie_la_ipoteza_clinica_DRAFT.md` — STABLE DRAFT / DOCTRINAL PASS / SCIENTIFIC AUDIT CLOSED / STYLE PASS / READER PASS CLOSED / CH46-DIAG-01 ACTIVE;"
          )
          s = s.replace(
              "- `reviews/CH46_READER_PASS.md` — PASS WITH MODERATE REVISION / REVISION INTEGRATED IN DRAFT v3 / EXTERNAL STYLE RECHECK RECEIVED / PASS WITH MICRO-REVISION / MICRO-REVISION INTEGRATED / STYLE RECHECK REQUIRED / CH46-DIAG-01 PROTECTED / fără STYLE PASS / fără READER PASS CLOSED / fără STABLE DRAFT.",
              "- `reviews/CH46_READER_PASS.md` — STYLE PASS / READER PASS CLOSED / CHAPTER STABLE / CH46-DIAG-01 PROTECTED."
          )
          s = s.replace(
              "**HOLD-ul este protejat și nu blochează DOCTRINAL PASS / SCIENTIFIC AUDIT CLOSED al cap. 46; reader pass-ul DRAFT v2 cere menținerea lui în revizia stilistică.**",
              "**HOLD-ul este protejat, non-blocking și nu împiedică STABLE DRAFT al cap. 46.**"
          )
          old_editorial_tail = "Recheck-ul stilistic extern integral al DRAFT v3 a acordat **PASS WITH MICRO-REVISION**; cele cinci intervenții locale au fost integrate, inclusiv comprimarea tensiunii 1952 ↔ `Lehrbuch` și scurtarea finalului pentru continuitatea cu CH47. Următorul și singurul gate rămas este recheck-ul stilistic extern final pentru `STYLE PASS / READER PASS CLOSED`."
          new_editorial_tail = "Recheck-ul stilistic extern integral al DRAFT v3 a acordat **PASS WITH MICRO-REVISION**; cele cinci intervenții locale au fost integrate, inclusiv comprimarea tensiunii 1952 ↔ `Lehrbuch` și scurtarea finalului pentru continuitatea cu CH47. Verdictul final al ultimului auditor a acordat **STYLE PASS / READER PASS CLOSED** și a cerut obligatoriu **STABLE DRAFT**. `CH46-DIAG-01` rămâne activ și non-blocking. Capitolul este stabil."
          assert old_editorial_tail in s
          s = s.replace(old_editorial_tail, new_editorial_tail, 1)

          old_step = "- **CH46 — RECHECK STILISTIC EXTERN FINAL AL DRAFT v3 MICRO-REVIZUIT, blob `a2b365c72c375699941dabed10ddc4bbf37049a9`, pentru `STYLE PASS / READER PASS CLOSED`.**"
          new_step = "- **CH46 — STABLE DRAFT / gate-uri doctrinar, științific, stilistic și reader închise; `CH46-DIAG-01` rămâne non-blocking.**"
          assert old_step in s
          s = s.replace(old_step, new_step, 1)

          # Ensure the active CH46 section contains no stale gate markers.
          ch46 = s[s.index("## Capitolul 46"):s.index("## Capitolul 47")]
          for stale in ["STYLE RECHECK REQUIRED", "fără STYLE PASS", "fără READER PASS CLOSED", "fără STABLE DRAFT", "așteaptă recheck"]:
              assert stale not in ch46, stale
          state_path.write_text(s, encoding="utf-8")
          PY
      - name: Commit synchronized CH46 state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/manual/chapters/46_Sindromul_experimental_de_la_constelatie_la_ipoteza_clinica_DRAFT.md docs/manual/reviews/CH46_READER_PASS.md docs/manual/CURRENT_STATE.md
          git diff --cached --quiet && exit 1
          git commit -m "manual: stabilize CH46 after final external verdict"
          git push
